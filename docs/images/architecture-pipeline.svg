<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="900" viewBox="0 0 2200 900" role="img" aria-labelledby="title desc">
  <title id="title">MTG Commander Recommendation Platform architecture pipeline</title>
  <desc id="desc">Two-lane diagram showing the deployed runtime request path and the offline Scryfall reference-data build.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .lane-title { font: 700 17px Arial, sans-serif; letter-spacing: 1px; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #1f2937; }
      .box-text { font: 13px Arial, sans-serif; fill: #374151; }
      .edge-text { font: 12px Arial, sans-serif; fill: #374151; }
      .edge { fill: none; stroke: #34495e; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
      .client { fill: #dae8fc; stroke: #6c8ebf; }
      .aws { fill: #ffe6cc; stroke: #d79b00; }
      .storage { fill: #fff2cc; stroke: #d6b656; }
      .compute { fill: #f8cecc; stroke: #b85450; }
      .logic { fill: #d5e8d4; stroke: #82b366; }
      .route { fill: #e1d5e7; stroke: #9673a6; }
      .note { fill: #fff8dc; stroke: #d6b656; }
      .box { stroke-width: 2; rx: 12; }
      .label-bg { fill: white; opacity: .94; }
    </style>
  </defs>

  <rect width="2200" height="900" fill="#ffffff"/>
  <text x="1100" y="48" text-anchor="middle" class="title">MTG Commander Recommendation Platform</text>

  <rect x="20" y="80" width="2160" height="490" rx="16" fill="#f5f9ff" stroke="#6c8ebf" stroke-width="2"/>
  <text x="42" y="112" class="lane-title" fill="#2f5597">RUNTIME REQUEST</text>
  <rect x="20" y="590" width="2160" height="250" rx="16" fill="#f4fbf4" stroke="#82b366" stroke-width="2"/>
  <text x="42" y="622" class="lane-title" fill="#548235">OFFLINE REFERENCE-DATA BUILD</text>

  <!-- Runtime connectors -->
  <path class="edge" d="M 240 225 H 350"/>
  <rect class="label-bg" x="272" y="207" width="48" height="18" rx="3"/>
  <text x="296" y="220" text-anchor="middle" class="edge-text">HTTPS</text>

  <path class="edge" d="M 445 270 V 350"/>
  <rect class="label-bg" x="450" y="300" width="104" height="18" rx="3"/>
  <text x="502" y="313" text-anchor="middle" class="edge-text">default behavior</text>

  <path class="edge" d="M 540 225 H 780"/>
  <rect class="label-bg" x="582" y="196" width="158" height="20" rx="3"/>
  <text x="661" y="211" text-anchor="middle" class="edge-text">/api/* · strip /api prefix</text>

  <path class="edge" d="M 970 230 H 1100"/>
  <rect class="label-bg" x="980" y="201" width="110" height="20" rx="3"/>
  <text x="1035" y="216" text-anchor="middle" class="edge-text">Lambda proxy event</text>

  <path class="edge" d="M 1320 215 H 1380 V 160 H 1450"/>
  <rect class="label-bg" x="1361" y="173" width="42" height="18" rx="3"/>
  <text x="1382" y="186" text-anchor="middle" class="edge-text">route</text>

  <path class="edge" d="M 1320 250 H 1380 V 280 H 1450"/>
  <rect class="label-bg" x="1361" y="256" width="42" height="18" rx="3"/>
  <text x="1382" y="269" text-anchor="middle" class="edge-text">route</text>

  <path class="edge" d="M 1555 325 V 390"/>
  <rect class="label-bg" x="1484" y="345" width="142" height="18" rx="3"/>
  <text x="1555" y="358" text-anchor="middle" class="edge-text">owned-card evidence</text>

  <path class="edge" d="M 1660 435 H 1810"/>
  <rect class="label-bg" x="1694" y="406" width="82" height="20" rx="3"/>
  <text x="1735" y="421" text-anchor="middle" class="edge-text">top themes</text>

  <path class="edge" d="M 1980 390 V 290"/>
  <rect class="label-bg" x="1990" y="327" width="126" height="18" rx="3"/>
  <text x="2053" y="340" text-anchor="middle" class="edge-text">Pydantic response</text>

  <path class="edge" d="M 1640 160 H 1710 V 238 H 1795"/>
  <rect class="label-bg" x="1654" y="143" width="72" height="18" rx="3"/>
  <text x="1690" y="156" text-anchor="middle" class="edge-text">limits JSON</text>

  <path class="edge dashed" d="M 1900 290 V 520 H 285 V 300 H 150 V 270" stroke="#6c8ebf"/>
  <rect class="label-bg" x="804" y="498" width="390" height="20" rx="3"/>
  <text x="999" y="513" text-anchor="middle" class="edge-text">JSON returns through Lambda → API Gateway → CloudFront</text>

  <!-- Offline connectors -->
  <path class="edge" d="M 260 713 H 410"/>
  <rect class="label-bg" x="290" y="684" width="90" height="20" rx="3"/>
  <text x="335" y="699" text-anchor="middle" class="edge-text">bulk metadata</text>

  <path class="edge" d="M 600 713 H 760"/>
  <rect class="label-bg" x="643" y="684" width="76" height="20" rx="3"/>
  <text x="681" y="699" text-anchor="middle" class="edge-text">Oracle JSON</text>

  <path class="edge" d="M 970 713 H 1130"/>
  <rect class="label-bg" x="990" y="684" width="120" height="20" rx="3"/>
  <text x="1050" y="699" text-anchor="middle" class="edge-text">deterministic outputs</text>

  <path class="edge" d="M 1350 713 H 1510"/>
  <rect class="label-bg" x="1386" y="684" width="88" height="20" rx="3"/>
  <text x="1430" y="699" text-anchor="middle" class="edge-text">build artifact</text>

  <path class="edge dashed" d="M 1620 665 V 620 H 1210 V 285" stroke="#82b366"/>
  <rect class="label-bg" x="1330" y="598" width="142" height="20" rx="3"/>
  <text x="1401" y="613" text-anchor="middle" class="edge-text">reference-data cache</text>

  <path d="M 1900 720 H 1730" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="8 6"/>
  <rect class="label-bg" x="1762" y="691" width="124" height="20" rx="3"/>
  <text x="1824" y="706" text-anchor="middle" class="edge-text">provisions + monitors</text>

  <!-- Runtime boxes -->
  <rect class="box client" x="60" y="180" width="180" height="90"/>
  <text x="150" y="207" text-anchor="middle" class="box-title">User / React UI</text>
  <text x="150" y="230" text-anchor="middle" class="box-text">Uploads collection CSV</text>
  <text x="150" y="250" text-anchor="middle" class="box-text">Displays recommendations</text>

  <rect class="box aws" x="350" y="180" width="190" height="90"/>
  <text x="445" y="207" text-anchor="middle" class="box-title">CloudFront</text>
  <text x="445" y="230" text-anchor="middle" class="box-text">Single HTTPS entry point</text>
  <text x="445" y="250" text-anchor="middle" class="box-text">Caching + security headers</text>

  <rect class="box storage" x="350" y="350" width="190" height="90"/>
  <text x="445" y="377" text-anchor="middle" class="box-title">Private S3 Bucket</text>
  <text x="445" y="400" text-anchor="middle" class="box-text">Static frontend assets</text>
  <text x="445" y="420" text-anchor="middle" class="box-text">CloudFront OAC only</text>

  <rect class="box aws" x="780" y="180" width="190" height="100"/>
  <text x="875" y="205" text-anchor="middle" class="box-title">API Gateway</text>
  <text x="875" y="226" text-anchor="middle" class="box-text">GET /config</text>
  <text x="875" y="246" text-anchor="middle" class="box-text">POST /recommendations</text>
  <text x="875" y="266" text-anchor="middle" class="box-text">10 req/s, burst 20</text>

  <rect class="box compute" x="1100" y="175" width="220" height="110"/>
  <text x="1210" y="200" text-anchor="middle" class="box-title">Lambda</text>
  <text x="1210" y="222" text-anchor="middle" class="box-text">ARM64 · 1,769 MB · 10 s</text>
  <text x="1210" y="244" text-anchor="middle" class="box-text">Mangum adapts events to ASGI</text>
  <text x="1210" y="266" text-anchor="middle" class="box-text">FastAPI handles routes</text>

  <rect class="box route" x="1450" y="125" width="190" height="70"/>
  <text x="1545" y="151" text-anchor="middle" class="box-title">GET /config</text>
  <text x="1545" y="175" text-anchor="middle" class="box-text">Returns upload limits</text>

  <rect class="box route" x="1450" y="235" width="210" height="90"/>
  <text x="1555" y="261" text-anchor="middle" class="box-title">POST /recommendations</text>
  <text x="1555" y="284" text-anchor="middle" class="box-text">Validate upload + parse CSV</text>
  <text x="1555" y="305" text-anchor="middle" class="box-text">Normalize card names</text>

  <rect class="box logic" x="1450" y="390" width="210" height="90"/>
  <text x="1555" y="417" text-anchor="middle" class="box-title">Theme Detection</text>
  <text x="1555" y="440" text-anchor="middle" class="box-text">Aggregate owned-card themes</text>
  <text x="1555" y="460" text-anchor="middle" class="box-text">using processed indexes</text>

  <rect class="box logic" x="1810" y="390" width="200" height="90"/>
  <text x="1910" y="417" text-anchor="middle" class="box-title">Score + Rank</text>
  <text x="1910" y="440" text-anchor="middle" class="box-text">Themes · colors · support</text>
  <text x="1910" y="460" text-anchor="middle" class="box-text">popularity · eligibility gate</text>

  <path class="note" stroke-width="2" d="M 1795 185 H 1975 L 2005 215 V 290 H 1795 Z M 1975 185 V 215 H 2005"/>
  <text x="1900" y="219" text-anchor="middle" class="box-title">Explainable JSON response</text>
  <text x="1900" y="243" text-anchor="middle" class="box-text">Up to 20 recommendations</text>
  <text x="1900" y="265" text-anchor="middle" class="box-text">UI shows 10 initially</text>

  <path class="note" stroke-width="2" d="M 60 365 H 235 L 265 395 V 490 H 60 Z M 235 365 V 395 H 265"/>
  <text x="162" y="393" text-anchor="middle" class="box-title">Request guardrails</text>
  <text x="162" y="416" text-anchor="middle" class="box-text">4 MiB · 20,000 rows</text>
  <text x="162" y="438" text-anchor="middle" class="box-text">Uploads are never persisted</text>
  <text x="162" y="460" text-anchor="middle" class="box-text">Reference data is cached;</text>
  <text x="162" y="478" text-anchor="middle" class="box-text">user data is not</text>

  <!-- Offline boxes -->
  <rect class="box client" x="70" y="675" width="190" height="75"/>
  <text x="165" y="704" text-anchor="middle" class="box-title">Scryfall Bulk Data</text>
  <text x="165" y="729" text-anchor="middle" class="box-text">Oracle Cards snapshot</text>

  <rect class="box logic" x="410" y="675" width="190" height="75"/>
  <text x="505" y="704" text-anchor="middle" class="box-title">Download</text>
  <text x="505" y="729" text-anchor="middle" class="box-text">download_scryfall.py</text>

  <rect class="box logic" x="760" y="665" width="210" height="95"/>
  <text x="865" y="692" text-anchor="middle" class="box-title">Normalize + Classify</text>
  <text x="865" y="715" text-anchor="middle" class="box-text">process_scryfall.py</text>
  <text x="865" y="738" text-anchor="middle" class="box-text">Reminder-safe theme rules</text>

  <rect class="box route" x="1130" y="665" width="220" height="95"/>
  <text x="1240" y="692" text-anchor="middle" class="box-title">Processed JSON Indexes</text>
  <text x="1240" y="715" text-anchor="middle" class="box-text">cards · names · commanders</text>
  <text x="1240" y="738" text-anchor="middle" class="box-text">theme-to-card mappings</text>

  <rect class="box compute" x="1510" y="665" width="220" height="95"/>
  <text x="1620" y="692" text-anchor="middle" class="box-title">Package with Lambda</text>
  <text x="1620" y="715" text-anchor="middle" class="box-text">Lazy load on cold request</text>
  <text x="1620" y="738" text-anchor="middle" class="box-text">Reuse immutable warm cache</text>

  <path class="note" stroke-width="2" d="M 1900 680 H 2080 L 2110 710 V 760 H 1900 Z M 2080 680 V 710 H 2110"/>
  <text x="2005" y="708" text-anchor="middle" class="box-title">Operational envelope</text>
  <text x="2005" y="733" text-anchor="middle" class="box-text">AWS CDK · CloudWatch · SNS</text>
</svg>
